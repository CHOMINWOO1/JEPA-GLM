seed: 7
mode: mlm_jepa
training:
  steps: 4
  batch_size: 1
  learning_rate: 0.00002
  min_learning_rate: 0.000002
  weight_decay: 0.01
  gradient_accumulation_steps: 64
  max_grad_norm: 1.0
  mixed_precision: true
  scheduler: cosine
  validation_fraction: 0.0
  ema_momentum: 0.996
  log_every: 1
data:
  synthetic: true
  num_sequences: 16
  sequence_length: 64
  stride: 64
  mask_ratio: 0.30
  mask_span_length: 8
model:
  backbone_name: zhihan1996/DNABERT-2-117M
  local_model_dir: models/dnabert2-117m
  tokenizer:
    type: hf
    name: zhihan1996/DNABERT-2-117M
    trust_remote_code: true
  trust_remote_code: true
  freeze_policy: all
  trainable_last_n_layers: 0
  gradient_checkpointing: false
  pooling: mean
  predictor_layers: 1
loss:
  lambda_jepa: 1.0
  lambda_mlm: 0.10
  lambda_reg: 0.02
