seed: 7
mode: mlm_jepa
training:
  steps: 1000
  batch_size: 1
  learning_rate: 0.00005
  min_learning_rate: 0.000005
  weight_decay: 0.01
  gradient_accumulation_steps: 32
  max_grad_norm: 1.0
  mixed_precision: true
  scheduler: cosine
  validation_fraction: 0.05
  ema_momentum: 0.996
  log_every: 10
data:
  synthetic: false
  sequence_length: 512
  stride: 512
  mask_ratio: 0.30
  mask_span_length: 32
  fasta_path: null
  manifest_csv: null
  split: train
model:
  backbone_name: zhihan1996/DNABERT-2-117M
  tokenizer:
    type: hf
    name: zhihan1996/DNABERT-2-117M
    trust_remote_code: true
  trust_remote_code: true
  freeze_policy: encoder_last_n
  trainable_last_n_layers: 4
  gradient_checkpointing: true
  pooling: mean
  predictor_layers: 2
loss:
  lambda_jepa: 1.0
  lambda_mlm: 0.25
  lambda_reg: 0.02
