seed: 7
mode: jepa_span_rc50_last2_opt500_8gb
training:
  optimizer_steps: 500
  batch_size: 1
  learning_rate: 5.0e-06
  min_learning_rate: 5.0e-07
  weight_decay: 0.01
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  mixed_precision: true
  scheduler: cosine
  validation_fraction: 0.02
  ema_momentum: 0.997
  log_every: 160
data:
  synthetic: false
  sequence_length: 512
  stride: 512
  mask_type: contiguous_span
  mask_ratio: 0.30
  mask_span_length: 8
  reverse_complement_probability: 0.50
  fasta_path: data/GRCh38.fa
  manifest_csv: outputs/grch38_windows.csv
  split: train
  max_windows: 30000
model:
  backbone_name: zhihan1996/DNABERT-2-117M
  local_model_dir: models/dnabert2-117m
  tokenizer:
    type: hf
    name: models/dnabert2-117m
    trust_remote_code: true
  trust_remote_code: true
  local_files_only: true
  freeze_policy: encoder_last_n
  trainable_last_n_layers: 2
  gradient_checkpointing: true
  pooling: mean
  predictor_layers: 2
  jepa_target_mode: masked_tokens
  max_length: 128
loss:
  jepa_loss: cosine
  lambda_jepa: 1.0
  lambda_mlm: 0.0
  lambda_reg: 0.05
