seed: 7
mode: jepa
training:
  steps: 2
  batch_size: 1
  learning_rate: 0.00002
  min_learning_rate: 0.000002
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: false
  scheduler: cosine
  validation_fraction: 0.0
  ema_momentum: 0.996
  log_every: 1
data:
  synthetic: false
  sequence_length: 512
  stride: 512
  mask_ratio: 0.30
  mask_span_length: 8
  fasta_path: data/GRCh38.fa
  manifest_csv: outputs/grch38_windows.csv
  split: train
  max_windows: 16
model:
  backbone_name: zhihan1996/DNABERT-2-117M
  local_model_dir: models/dnabert2-117m
  tokenizer:
    type: hf
    name: models/dnabert2-117m
    trust_remote_code: true
  trust_remote_code: true
  freeze_policy: all
  trainable_last_n_layers: 0
  gradient_checkpointing: false
  pooling: mean
  predictor_layers: 1
  max_length: 64
loss:
  lambda_jepa: 1.0
  lambda_mlm: 0.0
  lambda_reg: 0.02
