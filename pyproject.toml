[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-glm"
version = "0.1.0"
description = "Prototype JEPA continual pre-training components for genomic language models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
hf = ["transformers>=4.40,<5", "huggingface_hub>=0.23,<1", "einops>=0.7"]
dev = ["pytest>=7.4"]
docs = ["python-docx==1.2.0"]

[project.scripts]
jepa-glm-smoke = "jepa_glm.cli.smoke_test:main"
jepa-glm-run-training = "jepa_glm.cli.run_training:main"
jepa-glm-linear-probe = "jepa_glm.cli.run_linear_probe:main"
jepa-glm-finetune = "jepa_glm.cli.run_finetune:main"
jepa-glm-evaluate-variants = "jepa_glm.cli.evaluate_variants:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
